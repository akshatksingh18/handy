name: "code quality"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "vite.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "vite.config.*"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Test retained history delivery
        run: bun src/components/settings/history/deliveryText.test.ts

      - name: Run ESLint
        run: bun run lint

      - name: Check formatting (Prettier and cargo fmt)
        run: bun run format:check

      - name: Build and type-check the frontend
        run: bun run build
