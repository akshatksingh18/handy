name: "Windows x64 build"

# Manual, unsigned build of the Windows x64 voice-workspace.exe with the Vulkan GPU backend, for
# the x64 laptop's test runtime. No secrets, no signing, no release upload, read-only token. The
# installers are skipped; the artifact is the exe plus the DLLs it needs beside it.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-x64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: "1.98.0"
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64-${{ env.TARGET }}-no-bundle-v1
          cache-bin: false

      # The x64 build links transcribe-cpp with its Vulkan backend (see src-tauri/Cargo.toml).
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      # build.rs stages these into src-tauri/transcribe-libs so the exe runs without a system redist.
      - name: Locate x64 VC++ runtime and OpenMP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $version = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$version\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) { throw "x64 CRT redist not found under $archDir" }
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) { throw "x64 OpenMP redist not found under $archDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Tool versions
        shell: pwsh
        run: |
          rustc -Vv
          bun --version
          Get-ChildItem env:VULKAN_SDK

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --no-bundle compiles the release exe with the embedded production frontend and skips the
      # NSIS/MSI installers.
      - name: Build voice-workspace.exe
        run: bun x tauri build --target ${{ env.TARGET }} --no-bundle --ci

      - name: Stage and check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "src-tauri/target/$env:TARGET/release/voice-workspace.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          $dlls = Get-ChildItem "src-tauri/transcribe-libs" -Filter "*.dll" -ErrorAction SilentlyContinue
          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcomp140.dll") {
            if (-not ($dlls | Where-Object { $_.Name -ieq $name })) { throw "Staged runtime is missing $name" }
          }
          if (-not ($dlls | Where-Object { $_.Name -like "ggml-vulkan*.dll" })) { throw "Vulkan backend DLL was not staged" }
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item $exe stage/
          Copy-Item $dlls.FullName stage/

          # The runner has no GPU, so only the CPU device is expected here; the laptop's NVIDIA
          # device appears through the staged Vulkan backend.
          $devices = (& "stage/voice-workspace.exe" --list-devices | Out-String)
          $devices | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "voice-workspace.exe --list-devices failed" }
          if ($devices -notmatch "kind=cpu") { throw "x64 build did not expose its CPU device" }

          # Tray icons, sounds and the voice-activity model are read from resources/ beside the exe.
          Copy-Item src-tauri/resources stage/resources -Recurse
          $root = (Resolve-Path stage).Path
          Get-ChildItem stage -File -Recurse | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring($root.Length + 1).Replace('\', '/') } |
            Tee-Object -FilePath stage/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: voice-workspace-windows-x64-${{ github.sha }}
          path: stage
          if-no-files-found: error
          retention-days: 7
